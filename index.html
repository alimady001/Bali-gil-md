<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITACHI AKATSUKI SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --red:#ff0033;
  --dark:#000;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

/* ================= BLOOD LOADER ================= */
#bloodLoader{
  position:fixed;
  inset:0;
  background:#000;
  z-index:10000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.blood-text{
  color:red;
  font-size:28px;
  font-family:'Orbitron';
  text-shadow:0 0 20px red;
  margin-bottom:40px;
}

.drips span{
  position:absolute;
  top:0;
  width:6px;
  height:120px;
  background:red;
  animation:drip 2s infinite;
}
.drips span:nth-child(1){left:20%}
.drips span:nth-child(2){left:40%}
.drips span:nth-child(3){left:60%}
.drips span:nth-child(4){left:80%}

@keyframes drip{
  from{transform:translateY(-150px)}
  to{transform:translateY(100vh)}
}

#bloodLoader.hide{
  opacity:0;
  pointer-events:none;
  transition:1s;
}

/* ================= INTRO ================= */
#intro{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:red;
  cursor:pointer;
}

#intro.hide{
  opacity:0;
  pointer-events:none;
  transition:1s;
}
  
itachi.gif
  
itachi.mp3
/* ================= BACKGROUND ================= */
body{
  background:url('itachi.gif') center/cover no-repeat fixed;
  color:#fff;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:-1;
}

/* ================= NAV ================= */
nav{
  position:fixed;
  width:100%;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
}

/* ================= HEADER ================= */
header{
  text-align:center;
  padding:150px 20px 80px;
}

header h1{
  font-size:50px;
  color:red;
  text-shadow:0 0 20px red;
  font-family:'Orbitron';
}

/* SHARINGAN */
.sharingan{
  width:90px;
  height:90px;
  margin:20px auto;
  border-radius:50%;
  background:url('https://i.imgur.com/6QK7Z8Z.png') center/cover;
  animation:spin 4s linear infinite;
  box-shadow:0 0 30px red;
  cursor:pointer;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= PANEL ================= */
section{
  max-width:900px;
  margin:40px auto;
  padding:30px;
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,0,0,0.3);
  border-radius:16px;
}

/* BUTTON */
.btn{
  background:red;
  padding:12px 25px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

/* ================= FLASH ================= */
#mangekyoFlash{
  position:fixed;
  inset:0;
  background:red;
  opacity:0;
  pointer-events:none;
  z-index:9998;
}

.flash-active{
  animation:flash 0.6s;
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:1}
  100%{opacity:0}
}

/* SHAKE */
.shake{
  animation:shake 0.4s;
}
@keyframes shake{
  25%{transform:translate(-5px,5px)}
  50%{transform:translate(5px,-5px)}
}

/* CODE */
.code{
  margin-top:20px;
  font-size:28px;
  text-align:center;
  color:red;
}
</style>
</head>

<body>

<!-- BLOOD LOADER -->
<div id="bloodLoader">
  <div class="blood-text">AKATSUKI AWAKENING...</div>
  <div class="drips">
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- INTRO -->
<div id="intro">
  <h1>CLICK TO AWAKEN SHARINGAN</h1>
</div>

<!-- AUDIO -->
<audio id="voice" src="itachi.mp3"></audio>

<!-- FLASH -->
<div id="mangekyoFlash"></div>

<!-- NAV -->
<nav>
  <div>AKATSUKI</div>
</nav>

<header>
  <h1>ITACHI UCHIHA</h1>
  <div class="sharingan" id="eye"></div>
  <button class="btn" onclick="gen()">ENTER SYSTEM</button>
</header>

<section>
  <h2>Connect</h2>
  <input id="num" placeholder="923xxxxxxxxx" style="width:100%;padding:10px">
  <button class="btn" onclick="gen()">Generate Code</button>
  <div class="code" id="code"></div>
</section>

<script>
/* LOADER */
window.onload=()=>{
  setTimeout(()=>{
    document.getElementById("bloodLoader").classList.add("hide");
  },2000);
};

/* INTRO CLICK */
const intro=document.getElementById("intro");
const voice=document.getElementById("voice");

intro.onclick=()=>{
  voice.play().catch(()=>{});
  intro.classList.add("hide");
};

/* MANGEKYO EFFECT */
const eye=document.getElementById("eye");
const flash=document.getElementById("mangekyoFlash");

eye.onclick=()=>{
  flash.classList.add("flash-active");
  document.body.classList.add("shake");

  voice.currentTime=0;
  voice.play().catch(()=>{});

  setTimeout(()=>{
    flash.classList.remove("flash-active");
    document.body.classList.remove("shake");
  },600);
};

/* FAKE CODE */
function gen(){
  let c=Math.floor(1000+Math.random()*9000)+" "+Math.floor(1000+Math.random()*9000);
  document.getElementById("code").innerText=c;
}
</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALI GIL MINI MD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#e11d48;
  --primary-light:#f43f5e;
  --text:#ffffff;
  --muted:#d1d5db;
  --border:rgba(255,255,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
  transition: all .25s cubic-bezier(.4,0,.2,1);
}

body{
  color:var(--text);
  overflow-x:hidden;
}

/* VIDEO BACKGROUND */
#bgVideo{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:18px 40px;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.4);
  border-bottom:1px solid var(--border);
  z-index:100;
}

nav a{
  color:var(--muted);
  text-decoration:none;
  margin-left:20px;
}
nav a:hover{color:#fff}

/* HEADER */
header{
  text-align:center;
  padding:150px 20px 80px;
}

header h1{
  font-size:48px;
  margin-bottom:10px;
}

/* BUTTON */
.btn{
  background:var(--primary);
  padding:12px 24px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  position:relative;
  overflow:hidden;
}

.btn::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
}

.btn:hover::after{left:100%}
.btn:hover{background:var(--primary-light)}

/* PANEL */
section{
  max-width:1000px;
  margin:40px auto;
  padding:30px;
  border-radius:16px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
}

section:hover{
  transform:translateY(-6px);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:20px;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  border:1px solid var(--border);
}

.card:hover{transform:translateY(-5px)}

/* INPUT */
input{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.1);
  color:#fff;
}

input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(225,29,72,0.3);
}

/* STATUS */
#status{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  display:none;
}
.success{background:#065f46}
.error{background:#7f1d1d}

/* ANIMATION */
.fade{
  opacity:0;
  transform:translateY(30px);
}
.fade.show{
  opacity:1;
  transform:translateY(0);
}

/* CODE BOX */
.code{
  margin-top:20px;
  font-size:26px;
  letter-spacing:6px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop id="bgVideo">
  <source src="itachi.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- NAV -->
<nav>
  <div>BALI GIL</div>
  <div>
    <a href="#features">Features</a>
    <a href="#connect">Connect</a>
  </div>
</nav>

<!-- HEADER -->
<header>
  <h1>BALI GIL MINI MD</h1>
  <p>Premium WhatsApp Automation System</p>
  <a href="#connect" class="btn">Get Started</a>
</header>

<!-- FEATURES -->
<section id="features" class="fade">
  <h2>Features</h2>
  <div class="grid">
    <div class="card">Auto Replies</div>
    <div class="card">Media Tools</div>
    <div class="card">Commands</div>
    <div class="card">Security</div>
  </div>
</section>

<!-- CONNECT -->
<section id="connect" class="fade">
  <h2>Connect WhatsApp</h2>

  <input type="text" id="phone" placeholder="923xxxxxxxxx">
  <br><br>
  <button class="btn" onclick="getCode()">Request Code</button>

  <div id="status"></div>
  <div class="code" id="code"></div>
</section>

<script>
/* Scroll animation */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('show');
    }
  });
},{threshold:0.2});

document.querySelectorAll('.fade').forEach(el=>observer.observe(el));

/* Navbar shadow */
window.addEventListener('scroll', ()=>{
  document.querySelector('nav').style.boxShadow =
  window.scrollY>10 ? "0 10px 30px rgba(0,0,0,.4)" : "none";
});

/* Fake pairing */
function getCode(){
  let num = document.getElementById("phone").value;
  let status = document.getElementById("status");

  if(num.length<10){
    status.style.display="block";
    status.className="error";
    status.innerText="Invalid number";
    return;
  }

  status.style.display="block";
  status.className="success";
  status.innerText="Code generated";

  let code =
    Math.floor(1000+Math.random()*9000)+" "+
    Math.floor(1000+Math.random()*9000);

  document.getElementById("code").innerText=code;
}

/* Copy code */
document.getElementById("code").onclick=()=>{
  navigator.clipboard.writeText(document.getElementById("code").innerText);
};
</script>

</body>
</html>
